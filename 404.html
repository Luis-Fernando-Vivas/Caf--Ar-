<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Página no encontrada — Café Arú</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/img/logo-cafe-aru.png">
<meta name="theme-color" content="#17110c">
<link rel="stylesheet" href="/css/style.css">
<style>
  .status-wrap{
    min-height:100vh; display:flex; align-items:center; justify-content:center;
    padding:3rem 1.5rem; background:var(--c-cream);
  }
  .status-card{
    max-width:520px; width:100%; background:var(--c-white); border-radius:24px;
    padding:clamp(2rem,5vw,3rem); text-align:center; box-shadow:0 30px 60px -30px rgba(23,17,12,.25);
  }
  .status-card img.logo{ height:52px; margin:0 auto 1.5rem; }
  .status-card h1{ font-size:1.7rem; margin-bottom:.6rem; }
  .status-card p{ color:var(--c-text-soft); line-height:1.6; }
  .status-actions{ display:flex; gap:.8rem; justify-content:center; flex-wrap:wrap; margin-top:1.8rem; }
</style>
</head>
<body>

<div class="status-wrap">
  <div class="status-card">
    <img class="logo" src="/img/logo-cafe-aru.png" alt="Café Arú">
    <h1>No encontramos esta página</h1>
    <p>Puede que el enlace esté mal escrito o que la página ya no exista. Te dejamos algunos caminos para seguir.</p>
    <div class="status-actions">
      <a href="/" class="btn btn-ghost btn-sm">Volver al inicio</a>
      <a href="/tienda" class="btn btn-primary btn-sm">Ver la tienda</a>
    </div>
  </div>
</div>

</body>
</html>
