<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Productos — Backoffice Café Arú</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="../img/logo-cafe-aru.png">
<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="../css/admin.css">
<script src="https://upload-widget.cloudinary.com/latest/global/all.js"></script>
</head>
<body class="admin-body">

<div class="admin-shell">
  <aside class="admin-sidebar">
    <div class="admin-sidebar-brand">
      <img src="../img/logo-cafe-aru-light.png" alt="Café Arú">
      <span>Backoffice</span>
    </div>
    <nav class="admin-nav-links">
      <a href="/admin">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z"/><path d="M3 6h18"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>
        Pedidos
      </a>
      <a href="/admin/products" class="is-active">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"/><path d="m3.3 7 8.7 5 8.7-5"/><path d="M12 22V12"/></svg>
        Productos
      </a>
      <a href="/admin/shipping">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M14 18V6a1 1 0 0 0-1-1H4a1 1 0 0 0-1 1v11a1 1 0 0 0 1 1h1"/><path d="M15 18H9"/><path d="M19 18h2a1 1 0 0 0 1-1v-3.65a1 1 0 0 0-.22-.624l-3.48-4.35A1 1 0 0 0 17.52 8H14"/><circle cx="7" cy="18" r="2"/><circle cx="17" cy="18" r="2"/></svg>
        Envíos
      </a>
      <a href="/admin/coupons">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M12.586 2.586A2 2 0 0 0 11.172 2H4a2 2 0 0 0-2 2v7.172a2 2 0 0 0 .586 1.414l8.704 8.704a2.426 2.426 0 0 0 3.42 0l6.58-6.58a2.426 2.426 0 0 0 0-3.42z"/><circle cx="7.5" cy="7.5" r="1.5"/></svg>
        Cupones
      </a>
      <a href="/admin/reviews">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M11.525 2.295a.53.53 0 0 1 .95 0l2.31 4.679a2.123 2.123 0 0 0 1.595 1.16l5.166.756a.53.53 0 0 1 .294.904l-3.736 3.638a2.123 2.123 0 0 0-.611 1.878l.882 5.14a.53.53 0 0 1-.771.56l-4.618-2.428a2.122 2.122 0 0 0-1.973 0L6.396 21.01a.53.53 0 0 1-.77-.56l.881-5.139a2.122 2.122 0 0 0-.611-1.879L2.16 9.795a.53.53 0 0 1 .294-.906l5.165-.755a2.122 2.122 0 0 0 1.597-1.16z"/></svg>
        Reseñas
      </a>
    </nav>
    <div class="admin-sidebar-foot">
      <button id="logoutBtn" class="btn btn-ghost-light btn-sm">Cerrar sesión</button>
    </div>
  </aside>

  <div class="admin-content">
    <header class="admin-topbar">
      <h1>Productos</h1>
    </header>

    <main class="admin-main">

      <div class="admin-panel">
        <div class="admin-panel-head">
          <h2 id="formTitle">Nuevo producto</h2>
          <div class="admin-inline-actions">
            <button id="cancelEditBtn" class="btn btn-ghost btn-sm" type="button" style="display:none;">Cancelar edición</button>
          </div>
        </div>
        <form id="productForm" class="admin-form">
          <input type="hidden" id="productId">
          <div class="admin-form-grid">
            <div class="admin-form-field span-2">
              <label for="fName">Nombre</label>
              <input id="fName" required>
            </div>
            <div class="admin-form-field">
              <label for="fSlug">Slug (URL)</label>
              <input id="fSlug" placeholder="se genera solo si lo dejas vacío">
            </div>
            <div class="admin-form-field">
              <label for="fStatus">Estado</label>
              <select id="fStatus">
                <option value="active">Activo</option>
                <option value="draft">Borrador</option>
                <option value="archived">Archivado</option>
              </select>
            </div>
            <div class="admin-form-field">
              <label for="fPrice">Precio (COP)</label>
              <input id="fPrice" type="number" min="1" step="1" required>
            </div>
            <div class="admin-form-field">
              <label for="fCompareAt">Precio antes de descuento (opcional)</label>
              <input id="fCompareAt" type="number" min="1" step="1" placeholder="Vacío = sin tachado">
            </div>
            <div class="admin-form-field">
              <label for="fStock">Stock</label>
              <input id="fStock" type="number" min="0" step="1" required>
            </div>
            <div class="admin-form-field span-2">
              <label for="fTags">Notas de sabor (separadas por coma)</label>
              <input id="fTags" placeholder="Dulzura natural, Notas cítricas, Chocolate">
            </div>
            <div class="admin-form-field span-2">
              <label for="fGrindOptions">Presentaciones (separadas por coma, vacío = sin selector)</label>
              <input id="fGrindOptions" placeholder="Grano entero, Molido">
            </div>
            <div class="admin-form-field span-2">
              <label for="fDescription">Descripción</label>
              <textarea id="fDescription"></textarea>
            </div>
            <div class="admin-form-field span-2">
              <label>Fotos</label>
              <div id="thumbStrip" class="admin-thumb-strip">
                <button type="button" id="addImageBtn" class="admin-thumb-add">+ Subir foto</button>
              </div>
              <span class="admin-form-hint" id="cloudinaryHint"></span>
            </div>
          </div>
          <div class="admin-form-error" id="formError"></div>
          <div class="admin-form-actions">
            <button type="submit" class="btn btn-primary btn-sm" id="saveBtn">Guardar producto</button>
          </div>
        </form>
      </div>

      <div class="admin-panel">
        <div class="admin-panel-head">
          <h2>Productos</h2>
          <button id="refreshBtn" class="btn btn-ghost btn-sm" type="button">Actualizar</button>
        </div>
        <div class="admin-table-wrap">
          <table class="admin-table">
            <thead>
              <tr>
                <th>Foto</th>
                <th>Nombre</th>
                <th>Slug</th>
                <th>Precio</th>
                <th>Stock</th>
                <th>Estado</th>
                <th>Acciones</th>
              </tr>
            </thead>
            <tbody id="productsBody"></tbody>
          </table>
          <div id="productsEmpty" class="admin-empty" style="display:none;">Todavía no hay productos.</div>
        </div>
      </div>

    </main>
  </div>
</div>

<script src="../js/admin-products.js"></script>
</body>
</html>
