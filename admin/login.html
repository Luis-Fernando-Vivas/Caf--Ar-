<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — Café Arú</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="../img/logo-cafe-aru.png">
<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="../css/admin.css">
</head>
<body class="admin-body">

<div class="admin-login-wrap">
  <div class="admin-login-card">
    <img src="../img/logo-cafe-aru.png" alt="Café Arú">
    <h1>Backoffice</h1>
    <p>Ingresa la contraseña de administrador para ver los pedidos.</p>

    <form id="loginForm">
      <div class="admin-field">
        <label for="password">Contraseña</label>
        <input type="password" id="password" name="password" autocomplete="current-password" required>
      </div>
      <div id="loginError" class="admin-error"></div>
      <button type="submit" class="btn btn-primary">Entrar</button>
    </form>
  </div>
</div>

<script src="../js/admin.js"></script>
</body>
</html>
